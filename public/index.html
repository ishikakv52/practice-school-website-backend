<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexaHub School | Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="intro-panel">
        <p class="eyebrow">NEXAHUB SCHOOL</p>
        <h1>One place for every school day.</h1>
        <p class="intro-copy">Sign in to stay close to announcements, admissions, and your school community.</p>
        <div class="signal-list">
          <span>01</span><p>Personal updates for your role</p>
          <span>02</span><p>Instant school notifications</p>
          <span>03</span><p>Protected account access</p>
        </div>
      </section>

      <section class="form-panel">
        <div class="brand-mark">N<span>+</span></div>
        <div class="tabs" role="tablist">
          <button class="tab active" data-view="login" type="button">Log in</button>
          <button class="tab" data-view="signup" type="button">Create account</button>
        </div>

        <form id="login-form" class="auth-form">
          <div>
            <p class="eyebrow">WELCOME BACK</p>
            <h2>Log in to NexaHub</h2>
          </div>
          <label>Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required /></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" placeholder="Your password" required /></label>
          <button class="primary-button" type="submit">Continue <span>-></span></button>
        </form>

        <form id="signup-form" class="auth-form hidden">
          <div>
            <p class="eyebrow">NEW HERE?</p>
            <h2>Create your account</h2>
          </div>
          <label>Full name<input name="name" type="text" autocomplete="name" placeholder="Your full name" maxlength="150" required /></label>
          <label>Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required /></label>
          <label>Password<input name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required /></label>
          <label>Account type<select name="role" required><option value="parent">Parent</option><option value="student">Student</option></select></label>
          <button class="primary-button" type="submit">Create account <span>-></span></button>
        </form>

        <div id="status" class="status" role="status" aria-live="polite"></div>
        <button id="logout" class="text-button hidden" type="button">Log out</button>
      </section>
    </main>
    <script src="/auth.js"></script>
  </body>
</html>
